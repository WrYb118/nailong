<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>课程作业 · 个人主页</title>
<meta name="description" content="">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232C4A7C'/%3E%3Cpath d='M10 9h12v2.4H12.6v3.2H20V17h-7.4v3.4H22V23H10z' fill='%23FAF8F4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="./"><span class="brand__mark" aria-hidden="true"></span><span id="brand-name">课程作业</span></a>
    <nav class="topnav" id="topnav" aria-label="站内导航"></nav>
  </div>
</header>

<main id="main">

  <section class="hero wrap" aria-labelledby="hero-name">
    <div class="hero__avatar" id="avatar" aria-hidden="true"></div>
    <div class="hero__body">
      <p class="eyebrow" id="tagline"></p>
      <h1 class="hero__name" id="hero-name"></h1>
      <p class="hero__bio" id="bio"></p>
      <div class="hero__meta" id="meta"></div>
    </div>
  </section>

  <section class="work wrap" aria-labelledby="work-title">
    <div class="section-head">
      <h2 id="work-title">课程作业</h2>
      <p class="section-count" id="count" aria-live="polite"></p>
    </div>
    <p class="section-sub" id="work-sub">按时间倒序归档 · 支持课程筛选与关键词检索</p>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="按课程筛选"></div>
      <div class="search">
        <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg>
        <input id="search" type="search" placeholder="搜索标题、关键词" aria-label="搜索作业" autocomplete="off">
      </div>
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="empty" id="empty" hidden>
      <p class="empty__title">没有匹配的内容</p>
      <p class="empty__hint">换个关键词，或点左侧「全部」。</p>
    </div>
  </section>

</main>

<footer class="footer wrap">
  <p class="footer__left" id="footer-note"></p>
  <p class="footer__right" id="footer-updated"></p>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>d
