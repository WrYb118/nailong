<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>王睿毅 · 实验记录</title>
<meta name="description" content="用 AI agent 做东西的过程记录：想做什么、卡在哪、最后怎么跑通。">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232C4A7C'/%3E%3Cpath d='M10 9h12v2.4H12.6v3.2H20V17h-7.4v3.4H22V23H10z' fill='%23FAF8F4'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>

<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="./"><span class="brand__mark" aria-hidden="true"></span><span id="brand-name">实验记录</span></a>
    <nav class="topnav" id="topnav" aria-label="站内导航"></nav>
  </div>
</header>

<main id="main">

  <section class="hero wrap" aria-labelledby="hero-name">
    <div class="hero__avatar" id="avatar" aria-hidden="true"></div>
    <div class="hero__body">
      <p class="eyebrow" id="tagline"></p>
      <h1 class="hero__name" id="hero-name"></h1>
      <p class="hero__bio" id="bio"></p>
      <div class="hero__meta" id="meta"></div>
    </div>
  </section>

  <!-- ================= 小 tips：每次刷新随机一条 =================
       提示语内容在 assets/js/data.js 末尾的 TIPS 数组里，改那里就行。
       样式和逻辑都写在这一块里，不用动其他文件。 -->
  <style>
    .tip {
      display: none;
      align-items: baseline;
      gap: 12px;
      margin: 0 0 46px;
      padding: 13px 18px;
      border-left: 2px solid var(--accent);
      background: var(--accent-wash);
      border-radius: 0 4px 4px 0;
    }
    .tip.is-ready {
      display: flex;
      animation: tipIn .38s cubic-bezier(.22, .61, .36, 1) both;
    }
    @keyframes tipIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    .tip__label {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .tip__text {
      margin: 0;
      font-size: 14px;
      line-height: 1.7;
      color: var(--ink-soft);
    }
    @media (max-width: 760px) {
      .tip { margin-bottom: 34px; padding: 11px 14px; }
      .tip__text { font-size: 13.5px; }
    }
  </style>

  <div class="wrap">
    <aside class="tip" id="tip">
      <span class="tip__label">Tips</span>
      <p class="tip__text" id="tip-text"></p>
    </aside>
  </div>

  <script>
    // 等 data.js 加载完再执行，否则拿不到 TIPS
    window.addEventListener("load", function () {
      var box = document.getElementById("tip");
      var text = document.getElementById("tip-text");
      if (!box || !text || typeof TIPS === "undefined" || !TIPS.length) return;

      // 记住上一条，刷新时避开它，保证每次看到的都不一样
      var last = sessionStorage.getItem("nailong-last-tip");
      var pool = TIPS.length > 1 ? TIPS.filter(function (t) { return t !== last; }) : TIPS;
      var pick = pool[Math.floor(Math.random() * pool.length)];

      text.textContent = pick;
      sessionStorage.setItem("nailong-last-tip", pick);
      box.classList.add("is-ready");
    });
  </script>

  <section class="work wrap" aria-labelledby="work-title">
    <div class="section-head">
      <h2 id="work-title">实验记录</h2>
      <p class="section-count" id="count" aria-live="polite"></p>
    </div>
    <p class="section-sub" id="work-sub">按时间倒序 · 支持方向筛选与关键词检索</p>

    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="按课程筛选"></div>
      <div class="search">
        <svg class="search__icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg>
        <input id="search" type="search" placeholder="搜索标题、关键词" aria-label="搜索作业" autocomplete="off">
      </div>
    </div>

    <div class="timeline" id="timeline"></div>

    <div class="empty" id="empty" hidden>
      <p class="empty__title">没有匹配的记录</p>
      <p class="empty__hint">换个关键词，或点左侧「全部」。</p>
    </div>
  </section>

</main>

<footer class="footer wrap">
  <p class="footer__left" id="footer-note"></p>
  <p class="footer__right" id="footer-updated"></p>
</footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
